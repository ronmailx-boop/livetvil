<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טלוויזיה ישראלית חי</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --surface: #0e1119;
    --surface2: #151b27;
    --border: rgba(255,255,255,0.07);
    --accent12: #e8a020;
    --accent13: #3a8ef5;
    --text: #e8eaf0;
    --muted: #5a6478;
    --glow12: rgba(232,160,32,0.35);
    --glow13: rgba(58,142,245,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(14,17,25,0.95) 0%, transparent 100%);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  }

  .logo {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: #e05050;
    border-radius: 50%;
    animation: blink 1.4s ease-in-out infinite;
    box-shadow: 0 0 6px #e05050;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .live-badge {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #e05050;
    border: 1px solid rgba(224,80,80,0.4);
    padding: 2px 8px;
    border-radius: 3px;
  }

  /* Channel selector */
  .channel-bar {
    display: flex;
    gap: 12px;
    padding: 20px 28px 0;
    align-items: stretch;
  }

  .ch-btn {
    position: relative;
    flex: 1;
    max-width: 220px;
    padding: 18px 22px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: right;
    overflow: hidden;
  }

  .ch-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
    border-radius: inherit;
  }

  .ch-btn.ch12::before { background: radial-gradient(ellipse at 30% 50%, var(--glow12), transparent 70%); }
  .ch-btn.ch13::before { background: radial-gradient(ellipse at 30% 50%, var(--glow13), transparent 70%); }

  .ch-btn:hover::before,
  .ch-btn.active::before { opacity: 1; }

  .ch-btn.active.ch12 { border-color: var(--accent12); box-shadow: 0 0 20px var(--glow12), inset 0 1px 0 rgba(232,160,32,0.2); }
  .ch-btn.active.ch13 { border-color: var(--accent13); box-shadow: 0 0 20px var(--glow13), inset 0 1px 0 rgba(58,142,245,0.2); }

  .ch-btn:hover { transform: translateY(-1px); }

  .ch-num {
    font-size: 2rem;
    font-weight: 900;
    line-height: 1;
    position: relative;
  }
  .ch-btn.ch12 .ch-num { color: var(--accent12); }
  .ch-btn.ch13 .ch-num { color: var(--accent13); }

  .ch-name {
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--muted);
    margin-top: 4px;
    position: relative;
  }

  .ch-tag {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .ch-btn.ch12 .ch-tag { background: rgba(232,160,32,0.15); color: var(--accent12); border: 1px solid rgba(232,160,32,0.3); }
  .ch-btn.ch13 .ch-tag { background: rgba(58,142,245,0.15); color: var(--accent13); border: 1px solid rgba(58,142,245,0.3); }

  /* Video area */
  .video-wrap {
    flex: 1;
    padding: 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  /* Idle screen */
  .idle-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(ellipse at center, #0e1525 0%, #06080d 100%);
  }

  .idle-icon {
    font-size: 3.5rem;
    opacity: 0.3;
  }

  .idle-text {
    font-size: 0.9rem;
    color: var(--muted);
    font-weight: 300;
  }

  /* Loader */
  .loader {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    flex-direction: column;
    gap: 16px;
  }

  .loader.visible { display: flex; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--active-accent, #fff);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 300;
  }

  /* Error overlay */
  .error-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    flex-direction: column;
    gap: 12px;
    padding: 20px;
  }
  .error-overlay.visible { display: flex; }
  .error-overlay .err-icon { font-size: 2rem; }
  .error-overlay .err-msg { font-size: 0.82rem; color: var(--muted); text-align: center; line-height: 1.6; }
  .retry-btn {
    margin-top: 6px;
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .retry-btn:hover { background: var(--surface); border-color: rgba(255,255,255,0.2); }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted);
    padding: 0 2px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.live { background: #4caf50; box-shadow: 0 0 5px #4caf50; animation: blink 2s infinite; }
  .status-dot.loading { background: #f0a030; animation: blink 0.6s infinite; }
  .status-dot.error { background: #e05050; }

  /* Custom URL */
  .url-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }

  .url-label {
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .url-input-row {
    display: flex;
    gap: 10px;
  }

  .url-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 0.78rem;
    direction: ltr;
    text-align: left;
    transition: border-color 0.2s;
  }
  .url-input:focus { outline: none; border-color: rgba(255,255,255,0.25); }
  .url-input::placeholder { color: var(--muted); font-size: 0.72rem; }

  .url-go-btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .url-go-btn:hover { background: rgba(255,255,255,0.07); }

  /* Stream selector dots */
  .stream-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .sdot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.4;
  }
  .sdot.active { opacity: 1; }
  .sdot.ch12 { background: var(--accent12); }
  .sdot.ch13 { background: var(--accent13); }

  /* Footer */
  footer {
    padding: 12px 28px;
    text-align: center;
    font-size: 0.65rem;
    color: #2a3040;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    טלוויזיה חי
  </div>
  <div class="live-badge">LIVE</div>
</header>

<div class="channel-bar">
  <button class="ch-btn ch12" onclick="selectChannel(12)">
    <span class="ch-tag">Keshet</span>
    <div class="ch-num">12</div>
    <div class="ch-name">קשת 12</div>
  </button>
  <button class="ch-btn ch13" onclick="selectChannel(13)">
    <span class="ch-tag">Reshet</span>
    <div class="ch-num">13</div>
    <div class="ch-name">רשת 13</div>
  </button>
</div>

<div class="video-wrap">
  <div class="video-container" id="videoContainer">
    <video id="video" controls playsinline></video>

    <div class="idle-screen" id="idleScreen">
      <div class="idle-icon">📺</div>
      <div class="idle-text">בחר ערוץ לצפייה</div>
    </div>

    <div class="loader" id="loader">
      <div class="spinner" id="spinner"></div>
      <div class="loader-text" id="loaderText">טוען שידור...</div>
    </div>

    <div class="error-overlay" id="errorOverlay">
      <div class="err-icon">⚠️</div>
      <div class="err-msg" id="errMsg">הסטרים לא זמין כרגע.<br>נסה URL ידני מטה.</div>
      <button class="retry-btn" id="retryBtn" onclick="retryNext()">נסה סטרים אחר</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">בחר ערוץ</span>
    </div>
    <div class="stream-dots" id="streamDots"></div>
  </div>

  <div class="url-panel">
    <div class="url-label">🔗 URL מותאם אישית (m3u8)</div>
    <div class="url-input-row">
      <input class="url-input" id="urlInput" type="text" placeholder="https://example.com/stream/index.m3u8" dir="ltr">
      <button class="url-go-btn" onclick="playCustomUrl()">▶ הפעל</button>
    </div>
  </div>
</div>

<footer>
  שידורים ישראלים חי · הסטרימינג ניתן על ידי ערוצי השידור הרשמיים
</footer>

<script>
const STREAMS = {
  12: [
    // ערוץ 12 - קשת (דורש טוקן - נסה את הבסיסי)
    'https://mako-streaming.akamaized.net/stream/hls/live/2033791/k12n12wad/index.m3u8',
    'https://mako-streaming.akamaized.net/n12/hls/live/2103938/k12/index.m3u8',
    'https://mako-streaming.akamaized.net/direct/hls/live/2033791/k12dvr/index.m3u8',
  ],
  13: [
    'https://d18b0e6mopany4.cloudfront.net/out/v1/2f2bc414a3db4698a8e94b89eaf2da2a/index.m3u8',
    'https://d198ztbnlup2iq.cloudfront.net/out/v1/2d9050c90fb94df8b78d1d98306a1a65/index.m3u8',
    'https://d2xg1g9o5vns8m.cloudfront.net/out/v1/0855d703f7d5436fae6a9c7ce8ca5075/index.m3u8',
    'https://d2xg1g9o5vns8m.cloudfront.net/out/v1/66d4ac8748ce4a9298b4e40e48d1ae2f/index.m3u8',
  ]
};

const COLORS = { 12: '#e8a020', 13: '#3a8ef5' };
const NAMES  = { 12: 'קשת 12', 13: 'רשת 13' };

let currentCh = null;
let currentIdx = 0;
let hls = null;
let retryCount = 0;

const video       = document.getElementById('video');
const idleScreen  = document.getElementById('idleScreen');
const loader      = document.getElementById('loader');
const spinner     = document.getElementById('spinner');
const loaderText  = document.getElementById('loaderText');
const errorOverlay= document.getElementById('errorOverlay');
const statusDot   = document.getElementById('statusDot');
const statusText  = document.getElementById('statusText');
const streamDots  = document.getElementById('streamDots');
const errMsg      = document.getElementById('errMsg');

function selectChannel(ch) {
  currentCh = ch;
  currentIdx = 0;
  retryCount = 0;

  // Update button states
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.ch-btn.ch' + ch).classList.add('active');

  // Spinner color
  spinner.style.borderTopColor = COLORS[ch];

  buildDots(ch);
  loadStream(STREAMS[ch][0], ch, 0);
}

function buildDots(ch) {
  const urls = STREAMS[ch];
  streamDots.innerHTML = '';
  urls.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'sdot ch' + ch + (i === 0 ? ' active' : '');
    d.title = 'סטרים ' + (i + 1);
    d.onclick = () => loadStream(STREAMS[ch][i], ch, i);
    streamDots.appendChild(d);
  });
}

function updateDot(idx) {
  streamDots.querySelectorAll('.sdot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
  });
}

function loadStream(url, ch, idx) {
  currentIdx = idx;
  updateDot(idx);
  showLoader(true);
  hideError();
  idleScreen.style.display = 'none';

  setStatus('loading', `טוען ${NAMES[ch]}...`);

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30,
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
    });

    hls.on(Hls.Events.FRAG_LOADED, () => {
      showLoader(false);
      setStatus('live', `${NAMES[ch]} · שידור חי`);
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        showLoader(false);
        showError(ch, idx);
      }
    });

    // Fallback timeout
    setTimeout(() => {
      if (loader.classList.contains('visible')) {
        showLoader(false);
        showError(ch, idx);
      }
    }, 12000);

  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      showLoader(false);
      setStatus('live', `${NAMES[ch]} · שידור חי`);
      video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => {
      showLoader(false);
      showError(ch, idx);
    }, { once: true });
  } else {
    showLoader(false);
    showError(ch, idx, 'הדפדפן שלך אינו תומך בשמעות HLS.');
  }
}

function showLoader(v) {
  loader.classList.toggle('visible', v);
}

function showError(ch, idx, msg) {
  const next = idx + 1 < STREAMS[ch].length;
  errMsg.innerHTML = msg || (
    next
      ? `הסטרים ${idx + 1} לא זמין.<br>ניסיון עם סטרים ${idx + 2}...`
      : `כל הסטרימים של ערוץ ${ch} לא זמינים.<br>ניתן להזין URL ידני מטה.`
  );

  if (!msg && next) {
    setTimeout(() => retryNext(), 1500);
  } else {
    errorOverlay.classList.add('visible');
    document.getElementById('retryBtn').style.display = next ? 'block' : 'none';
  }
  setStatus('error', `שגיאה · ערוץ ${ch}`);
}

function hideError() {
  errorOverlay.classList.remove('visible');
}

function retryNext() {
  if (!currentCh) return;
  const streams = STREAMS[currentCh];
  const next = currentIdx + 1;
  if (next < streams.length) {
    hideError();
    loadStream(streams[next], currentCh, next);
  } else {
    errorOverlay.classList.add('visible');
    errMsg.innerHTML = `כל הסטרימים של ערוץ ${currentCh} אינם זמינים.<br>נסה URL ידני מטה.`;
    document.getElementById('retryBtn').style.display = 'none';
  }
}

function setStatus(type, text) {
  statusDot.className = 'status-dot ' + type;
  statusText.textContent = text;
}

function playCustomUrl() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;
  if (!url.startsWith('http')) { alert('URL לא תקין'); return; }
  currentCh = null;
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  streamDots.innerHTML = '';
  idleScreen.style.display = 'none';
  showLoader(true);
  setStatus('loading', 'טוען...');

  if (hls) { hls.destroy(); hls = null; }

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); });
    hls.on(Hls.Events.FRAG_LOADED, () => { showLoader(false); setStatus('live', 'שידור חי · URL מותאם'); });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) { showLoader(false); showError(null, -1, 'לא ניתן לטעון את הסטרים. בדוק את ה-URL.'); }
    });
    setTimeout(() => {
      if (loader.classList.contains('visible')) { showLoader(false); showError(null, -1, 'לא ניתן לטעון את הסטרים.'); }
    }, 12000);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.load();
    video.play().catch(()=>{});
    setStatus('live', 'שידור חי');
    showLoader(false);
  }
}

// Enter key in URL input
document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') playCustomUrl();
});
</script>
</body>
</html>
